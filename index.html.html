<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Secret Challenge</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:linear-gradient(145deg,#fff1f5,#f3e8ff);
    color:#2b2430; padding:22px;
  }
  .card{
    width:min(430px,100%); background:rgba(255,255,255,.88);
    border-radius:28px; padding:32px 24px; text-align:center;
    box-shadow:0 18px 55px rgba(70,35,75,.15);
  }
  .heart{font-size:54px; animation:pulse 1.2s infinite alternate}
  @keyframes pulse{to{transform:scale(1.12)}}
  h1{margin:12px 0 8px;font-size:30px}
  p{line-height:1.55;color:#665b69}
  button{
    width:100%; border:0; border-radius:16px; padding:15px 18px;
    font-size:17px; font-weight:700; margin-top:12px; cursor:pointer;
    background:#222; color:white;
  }
  button.option{background:#fff;color:#342b38;border:1px solid #e8dfe9}
  button.option:hover{background:#f8eef8}
  .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:20px}
  .hidden{display:none}
  .msg{min-height:28px;margin-top:12px;font-weight:700}
  .success{color:#16834a}.fail{color:#c0394b}
  .bar{height:8px;background:#eee5ef;border-radius:99px;overflow:hidden;margin:10px 0 22px}
  .fill{height:100%;width:0;background:#222;transition:.35s}
</style>
</head>
<body>
<main class="card">
  <section id="start">
    <div class="heart">💌</div>
    <h1>Secret Challenge</h1>
    <p>有人替你準備了一個小挑戰。<br>完成它，也許會有驚喜。</p>
    <button onclick="begin()">START</button>
  </section>

  <section id="game" class="hidden">
    <div class="top"><span id="level">LEVEL 1 / 3</span><span id="lives">❤️❤️❤️</span></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <h1 id="question"></h1>
    <div id="answers"></div>
    <div class="msg" id="msg"></div>
  </section>

  <section id="win" class="hidden">
    <div class="heart">🎁</div>
    <h1>CHALLENGE COMPLETE!</h1>
    <p>測試版成功通關。<br>正式版這裡會解鎖你的神秘禮物 ✨</p>
    <button onclick="location.reload()">PLAY AGAIN</button>
  </section>
</main>

<script>
const qs=[
 {q:"第一關：準備好了嗎？",a:["還沒有 😭","當然準備好了 😎"],correct:1},
 {q:"第二關：哪一個比較像驚喜？",a:["📚 作業","🎁 神秘禮物","🧹 打掃"],correct:1},
 {q:"FINAL：要不要解鎖最後的驚喜？",a:["不要","當然要 ❤️"],correct:1}
];
let i=0,lives=3,locked=false;

function begin(){
 document.getElementById("start").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");
 render();
}
function render(){
 locked=false;
 document.getElementById("level").textContent=`LEVEL ${i+1} / ${qs.length}`;
 document.getElementById("lives").textContent="❤️".repeat(lives)+"🖤".repeat(3-lives);
 document.getElementById("fill").style.width=`${i/qs.length*100}%`;
 document.getElementById("question").textContent=qs[i].q;
 document.getElementById("msg").textContent="";
 const box=document.getElementById("answers"); box.innerHTML="";
 qs[i].a.forEach((x,n)=>{
   const b=document.createElement("button");
   b.className="option"; b.textContent=x;
   b.onclick=()=>choose(n); box.appendChild(b);
 });
}
function choose(n){
 if(locked)return; locked=true;
 const msg=document.getElementById("msg");
 if(n===qs[i].correct){
   msg.textContent="✓ Correct!"; msg.className="msg success";
   setTimeout(()=>{i++; if(i===qs.length)finish(); else render();},650);
 }else{
   lives--; msg.textContent="✕ Wrong answer!"; msg.className="msg fail";
   document.getElementById("lives").textContent="❤️".repeat(lives)+"🖤".repeat(3-lives);
   if(lives<=0){
     setTimeout(()=>{alert("Game Over — 再試一次 😈"); location.reload();},500);
   }else setTimeout(()=>{locked=false; msg.textContent="再選一次 👀";},650);
 }
}
function finish(){
 document.getElementById("game").classList.add("hidden");
 document.getElementById("win").classList.remove("hidden");
}
</script>
</body>
</html>
